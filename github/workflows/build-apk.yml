name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "Missing GitHub Secret: SUPABASE_URL"
            exit 1
          }

          test -n "$SUPABASE_ANON_KEY" || {
            echo "Missing GitHub Secret: SUPABASE_ANON_KEY"
            exit 1
          }

          case "$SUPABASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "SUPABASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_ANON_KEY" > .env

      - name: Check project structure
        run: |
          echo "Project files:"
          ls -la
          echo "App directory:"
          ls -la app || true

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew 2>/dev/null || true

      - name: Clean project
        run: |
          gradle --no-daemon clean

      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
