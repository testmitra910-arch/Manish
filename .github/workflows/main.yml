name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'


      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then

            echo "Android project found in repository root."

          else

            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP file not found."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf /tmp/testmitra
            mkdir -p /tmp/testmitra

            unzip -o "$ZIP_FILE" -d /tmp/testmitra

            SETTINGS_FILE=$(find /tmp/testmitra -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts/settings.gradle not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            echo "Project directory:"
            echo "$PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .

          fi

          echo "Project structure:"
          ls -la


      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts/settings.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle.kts/app/build.gradle not found."
            exit 1
          fi

          echo "Android project verified successfully."


      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Checking Supabase secrets..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            echo "Add SUPABASE_URL in:"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            echo "Add SUPABASE_ANON_KEY in:"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          case "$SUPABASE_URL" in

            http://*|https://*)
              echo "Supabase URL format is valid."
              ;;

            *)
              echo "ERROR: SUPABASE_URL must start with http:// or https://"
              exit 1
              ;;

          esac

          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            > .env

          echo "Supabase environment created successfully."


      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Starting Android build..."

          gradle clean assembleDebug --no-daemon

          echo "Android build completed successfully."


      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
