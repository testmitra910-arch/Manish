name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p /tmp/testmitra

          unzip -o "$ZIP_FILE" -d /tmp/testmitra

          echo "Extracted project:"
          find /tmp/testmitra -maxdepth 2 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find /tmp/testmitra -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create Supabase environment
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Checking Supabase secrets..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: SUPABASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

          echo ".env created successfully."

      - name: Fix Android debug signing
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          echo "Removing custom debug keystore configuration..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'\n\s*create\("debugConfig"\)\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          text = re.sub(
              r'\n\s*debug\s*\{\s*signingConfig\s*=\s*signingConfigs\.getByName\("debugConfig"\)\s*\}',
              '\n    debug {}',
              text
          )

          p.write_text(text)
          PY

          echo "Debug signing fixed."

      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project verified successfully."

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          echo "Building TEST MITRA APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
