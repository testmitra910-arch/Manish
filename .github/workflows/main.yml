name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repository download
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Find and extract ZIP if Android project is inside ZIP
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Android project already exists in repository root."
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or ZIP file not found."
              echo "Repository contents:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            mkdir -p /tmp/test-mitra-project
            unzip -q "$ZIP_FILE" -d /tmp/test-mitra-project

            echo "Extracted files:"
            find /tmp/test-mitra-project -maxdepth 3 -type f | sort | head -100

            if [ -f "/tmp/test-mitra-project/settings.gradle.kts" ]; then
              cp -a /tmp/test-mitra-project/. .
            else
              PROJECT_DIR=$(find /tmp/test-mitra-project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

              if [ -z "$PROJECT_DIR" ]; then
                echo "ERROR: settings.gradle.kts/settings.gradle not found inside ZIP."
                exit 1
              fi

              PROJECT_DIR=$(dirname "$PROJECT_DIR")
              cp -a "$PROJECT_DIR"/. .
            fi
          fi

          echo "Final project structure:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      # 5. Supabase Secrets
      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            http://*|https://*)
              echo "Supabase URL format is valid."
              ;;
            *)
              echo "ERROR: SUPABASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          cat > .env <<EOF
SUPABASE_URL=$SUPABASE_URL
SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
EOF

          echo ".env created successfully."

      # 6. Show Android project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "settings.gradle.kts" -o -f "settings.gradle" || {
            echo "ERROR: Gradle settings file not found."
            exit 1
          }

          test -d "app" || {
            echo "ERROR: app directory not found."
            exit 1
          }

          test -f "app/build.gradle.kts" -o -f "app/build.gradle" || {
            echo "ERROR: app Gradle file not found."
            exit 1
          }

          echo "Android project verified successfully."

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      # 8. Find APK
      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # 9. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
