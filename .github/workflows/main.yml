name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          if [ -f "gradlew" ]; then
            echo "Android project found in root."
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or ZIP not found."
              find . -maxdepth 3 -type f
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            mkdir -p /tmp/testmitra
            unzip -o "$ZIP_FILE" -d /tmp/testmitra

            GRADLEW=$(find /tmp/testmitra -type f -name "gradlew" | head -n 1)

            if [ -z "$GRADLEW" ]; then
              echo "ERROR: gradlew not found inside ZIP."
              find /tmp/testmitra -maxdepth 4 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")

            echo "Project directory: $PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .
          fi

          chmod +x ./gradlew

          echo "Project ready."
          ls -la

      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo "Gradle project OK."

      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            http://*|https://*)
              echo "Supabase URL OK."
              ;;
            *)
              echo "ERROR: SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac

          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            > .env

          echo "Supabase environment created."

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
