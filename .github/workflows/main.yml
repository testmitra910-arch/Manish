name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      # ------------------------------------------------
      # Extract the uploaded TEST MITRA ZIP
      # ------------------------------------------------

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for TEST MITRA ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/testmitra

          unzip -o "$ZIP_FILE" -d /tmp/testmitra

          echo "ZIP extracted."

          # Copy project files to repository root
          cp -a /tmp/testmitra/. .

          echo "Project files:"
          ls -la

      # ------------------------------------------------
      # Verify Android project
      # ------------------------------------------------

      - name: Check project structure
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            echo "Current directory:"
            pwd
            echo "Files:"
            ls -la
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "Android project verified successfully."

      # ------------------------------------------------
      # Create Supabase .env
      # ------------------------------------------------

      - name: Create .env from GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Checking Supabase secrets..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          case "$SUPABASE_URL" in
            http://*|https://*)
              echo "SUPABASE_URL format is valid."
              ;;
            *)
              echo "ERROR: SUPABASE_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

          echo ".env created successfully."

      # ------------------------------------------------
      # Build APK
      # ------------------------------------------------

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Building TEST MITRA APK..."

          gradle --no-daemon clean assembleDebug

          echo "APK build completed successfully."

      # ------------------------------------------------
      # Find APK
      # ------------------------------------------------

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------
      # Upload APK
      # ------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
